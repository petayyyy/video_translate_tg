# =============================================================================
#  video_tg — конфигурация бота
# =============================================================================
#  Скопируй этот файл в config.yaml и правь только его:
#      cp config.example.yaml config.yaml
#
#  Внутри любых строковых значений можно использовать переменные окружения:
#      token: "${BOT_TOKEN}"              — обязательная переменная
#      token: "${BOT_TOKEN:-заглушка}"    — со значением по умолчанию
#
#  Все пути указаны так, как они выглядят ВНУТРИ контейнера. На хосте им
#  соответствует каталог ./data (см. docker-compose.yml). Если запускаешь без
#  Docker — поменяй секцию paths на свои абсолютные пути.
#
#  Неизвестные ключи запрещены: если ошибёшься в названии параметра, бот
#  откажется стартовать и напишет, какой именно ключ он не понял.
# =============================================================================


telegram:
  # Токен от @BotFather. Можно вписать сюда строкой, но лучше держать в .env
  # и оставить подстановку ${BOT_TOKEN}.
  token: "${BOT_TOKEN}"

  # Белый список. Бот молча игнорирует всех, кого здесь нет.
  # Свой ID можно узнать у @userinfobot.
  allowed_user_ids:
    - 123456789

  # Работать через локальный сервер Telegram Bot API (контейнер telegram-bot-api).
  # Именно он поднимает лимит на отправку файла с 50 МБ до 2 ГБ.
  # false — использовать облачный api.telegram.org (лимит 50 МБ).
  use_local_api: true

  # Адрес локального Bot API внутри docker-сети. Менять не нужно.
  api_base_url: "http://telegram-bot-api:8081"

  # Локальный сервер запущен с ключом --local (так он и запускается в
  # docker-compose.yml). Позволяет отдавать файлы по абсолютному пути.
  # ВАЖНО: должно совпадать с наличием --local у контейнера telegram-bot-api.
  local_mode: true

  # Отдавать файл серверу Bot API по пути (file://...) вместо multipart-загрузки.
  # Для файлов в гигабайты это в разы быстрее. Если сборка telegram-bot-api
  # такое не принимает — бот автоматически откатится на обычную загрузку
  # и напишет об этом в лог. Можно принудительно выключить: false.
  use_file_uri: true

  # Отправлять готовый MP4 как video (проигрывается прямо в Telegram)
  # или как document (не сжимается клиентом, всегда качается файлом).
  # true — video, false — document.
  send_as_video: true

  # Таймаут на саму загрузку файла в Telegram, секунды.
  # Для 2 ГБ через локальный сервер с запасом хватает часа.
  upload_timeout_sec: 3600

  # Таймаут на обычные запросы к Bot API (sendMessage, editMessageText и т.п.).
  request_timeout_sec: 120

  # Максимальный размер файла, который бот пытается отправить через Telegram.
  # Всё, что больше, уходит ссылкой через nginx (секция links).
  # 2 ГБ = 2000000000. Для облачного API поставь 50000000.
  max_upload_bytes: 2000000000

  # Как часто редактировать сообщение с прогрессом, секунды.
  # Меньше 3 не ставь — упрёшься в лимиты Telegram на editMessageText.
  progress_edit_interval_sec: 4

  # Сколько секунд ждать между повторами при ошибке отправки в Telegram.
  send_retry_attempts: 3
  send_retry_delay_sec: 5


paths:
  # Корень для всех данных. Остальные пути по умолчанию лежат внутри него.
  data_dir: "/data"

  # Рабочий каталог для временных файлов одной задачи. Чистится всегда:
  # и при успехе, и при ошибке, и при отмене, и при рестарте контейнера.
  tmp_dir: "/data/tmp"

  # Готовые файлы, которые держим для кэша (см. секцию cache).
  cache_dir: "/data/cache"

  # Файлы, выложенные для скачивания по прямой ссылке через nginx.
  files_dir: "/data/files"

  # Каталог логов.
  logs_dir: "/data/logs"

  # База SQLite: очередь, кэш, одноразовые ссылки.
  db_path: "/data/db.sqlite3"

  # Файл cookies в формате Netscape для yt-dlp. Нужен для видео с
  # возрастным ограничением и когда YouTube начинает требовать
  # "Sign in to confirm you're not a bot". Пусто — не использовать.
  # Положи файл в ./data/cookies.txt на хосте и укажи "/data/cookies.txt".
  cookies_file: ""


vot:
  # Какая реализация используется. В образе установлены ОБЕ, переключение —
  # правка одной этой строки плюс docker compose restart bot, без пересборки.
  #
  #   foswly — FOSWLY/vot-cli. Ходит к Яндексу не напрямую, а через
  #            промежуточный бэкенд проекта. Если тот недоступен, перевод
  #            не запускается вовсе, а в логе видно "Failed to request
  #            create session" при успешном "Getting video data".
  #
  #   live   — fantomcheg/vot-cli-live. Не зависит от @vot.js и обращается
  #            к api.browser.yandex.ru напрямую, поэтому переживает отказ
  #            чужого бэкенда. Умеет живые голоса.
  #
  # Если перевод не запускается ни на одном ролике — переключись на "live",
  # это первое, что стоит попробовать. См. раздел «Диагностика» в README.
  flavor: "live"

  # Исполняемый файл. Пустое значение или "vot-cli" вместе с flavor: live
  # автоматически превращается в "vot-cli-live" — вручную менять не нужно.
  binary: "vot-cli"

  # Язык оригинала. "auto" — определить автоматически.
  # ВНИМАНИЕ: у FOSWLY/vot-cli 2.x живые голоса (lively_voice: true) с "auto"
  # не работают. Если lively_voice включён, бот сам подставит язык, найденный
  # через yt-dlp, а если не нашёл — значение из source_lang_fallback.
  source_lang: "auto"
  source_lang_fallback: "en"

  # Язык озвучки/субтитров.
  target_lang: "ru"

  # Живые голоса Яндекса вместо синтезированных.
  # Работают не для всех роликов и, возможно, требуют api_token (см. README,
  # раздел "Проверить перед первым запуском"). Дефолт — выключено, потому что
  # обычная озвучка доступна всегда.
  lively_voice: false

  # Требовать живые голоса даже там, где форк считает их недоступными.
  # Работает только вместе с lively_voice: true. Помогает на площадках,
  # которые форк не относит к поддерживаемым, но иногда даёт отказ вместо
  # перевода — тогда верни false.
  force_live_voices: false

  # УСТАРЕЛО, не используется. У vot-cli-live нет ни одного флага для токена
  # или авторизации — проверено по --help версии 1.7.5. Значение никуда не
  # отправляется. Оставлено только чтобы старые config.yaml продолжали
  # проходить валидацию; при непустом значении бот предупредит в логе.
  #
  # Почему это важно: живые голоса Яндекс, судя по всему, выдаёт только
  # аутентифицированным запросам. Расширение для браузера несёт вашу сессию
  # Яндекса и получает их, а форк ходит анонимно — и там, где голосов не
  # дали, бот автоматически переходит на обычный синтез.
  api_token: ""

  # HTTP/HTTPS-прокси для vot-cli (если Яндекс недоступен из твоей страны).
  # Пример: "http://user:pass@1.2.3.4:3128"
  proxy: ""

  # Альтернативные хосты бэкенда. Пусто — использовать значения по умолчанию.
  vot_host: ""
  worker_host: ""

  # Сначала пробовать режим --preview (получить прямую ссылку на дорожку,
  # не скачивая её самим vot-cli). Если не получилось разобрать ответ,
  # бот автоматически повторит вызов в обычном режиме скачивания в файл.
  use_preview: true

  # ---- Опрос статуса перевода -------------------------------------------
  # Яндекс переводит асинхронно: на первый запрос отвечает "жди N секунд".
  # Бот делает повторные попытки с экспоненциальной задержкой.

  # Таймаут ОДНОЙ попытки запроса перевода, секунды. По истечении процесс
  # vot-cli убивается и задача ждёт следующей попытки.
  attempt_timeout_sec: 180

  # Общий бюджет на получение перевода, секунды. Часовой лекции обычно
  # хватает 10-20 минут, 3600 взято с большим запасом.
  total_timeout_sec: 3600

  # Параметры задержки между попытками.
  backoff_start_sec: 20      # первая пауза
  backoff_factor: 1.5        # во сколько раз растёт каждая следующая
  backoff_max_sec: 120       # потолок паузы
  backoff_jitter_sec: 5      # случайная добавка 0..N, чтобы не долбить в такт

  # Формат субтитров для /subs. Поддерживается srt, vtt, json.
  subs_format: "srt"

  # Произвольные дополнительные аргументы, которые будут добавлены к каждому
  # вызову vot-cli. Обычно не нужно. Пример: ["--no-title"]
  extra_args: []


ytdlp:
  binary: "yt-dlp"

  # Максимальная высота кадра по умолчанию, пиксели.
  max_height: 1080

  # Высота для разовой команды /q720.
  low_height: 720

  # Шаблон выбора формата. {height} подставляется ботом.
  # Дефолт: лучшее видео нужной высоты + лучший звук, с откатом на
  # прогрессивный поток, если раздельных дорожек нет.
  format_template: "bestvideo[height<=?{height}]+bestaudio/best[height<=?{height}]/best"

  # Предпочитаемый контейнер результата. mp4 позволяет копировать видеопоток
  # без перекодирования на этапе склейки.
  merge_output_format: "mp4"

  # Таймаут на получение метаданных (название, длительность, язык), секунды.
  metadata_timeout_sec: 120

  # Таймаут на скачивание видео, секунды. Часовая лекция в 1080p качается
  # обычно за 2-10 минут, 3600 — запас на медленные площадки.
  download_timeout_sec: 3600

  # Число параллельных фрагментов при скачивании (ускоряет YouTube DASH).
  # На одном ядре больше 2 смысла не имеет: упрёшься в процессор и в диск,
  # а заодно отберёшь их у остальных сервисов машины.
  concurrent_fragments: 2

  # Ретраи внутри самого yt-dlp.
  retries: 10
  fragment_retries: 10

  # Ограничение скорости скачивания, например "10M". Пусто — без ограничения.
  # ВАЖНО, если на сервере работает VPN или прокси: скачивание двухгигабайтного
  # видео на полной скорости забьёт канал и остальные это почувствуют.
  # 5M примерно означает «час видео в 1080p скачается за 8 минут».
  rate_limit: "5M"

  # Прокси для yt-dlp. Пусто — не использовать.
  proxy: ""

  # Отказаться обрабатывать ролики длиннее N минут. 0 — без ограничения.
  max_duration_minutes: 240

  # Отказаться, если yt-dlp сообщает размер больше N байт. 0 — без ограничения.
  max_filesize_bytes: 0

  # Дополнительные аргументы к каждому вызову yt-dlp.
  # Пример: ["--extractor-args", "youtube:player_client=android"]
  extra_args: []


ffmpeg:
  binary: "ffmpeg"
  ffprobe_binary: "ffprobe"

  # Громкость ОРИГИНАЛЬНОЙ дорожки в основном режиме.
  # 0.10 = 10%. 0 — полностью заглушить (то же, что режим /orig).
  original_volume: 0.10

  # Громкость русской озвучки. 1.0 = как есть.
  translation_volume: 1.0

  # Нормализация громкости результата.
  dynaudnorm: true
  dynaudnorm_filter: "dynaudnorm=f=250:g=15:p=0.9:m=10"

  # Параметры выходной звуковой дорожки в MP4.
  audio_codec: "aac"
  audio_bitrate: "192k"
  audio_channels: 2

  # Разрешить перекодирование видео, если исходный кодек нельзя положить
  # в MP4 без изменений (например, VP9/AV1 из webm, когда ремукс невозможен).
  # false — в таком случае задача завершится понятной ошибкой.
  allow_video_transcode: true

  # Аргументы для этого редкого случая перекодирования. Учти: на CPU это
  # долго, поэтому под него отдельный, увеличенный таймаут.
  video_transcode_args:
    - "-c:v"
    - "libx264"
    - "-preset"
    - "veryfast"
    - "-crf"
    - "23"
    - "-pix_fmt"
    - "yuv420p"

  # Таймаут склейки без перекодирования видео, секунды.
  mux_timeout_sec: 3600

  # Таймаут склейки С перекодированием видео, секунды.
  transcode_timeout_sec: 14400

  # Таймаут ffprobe, секунды.
  probe_timeout_sec: 120

  # Если длительность русской дорожки отличается от видео больше чем на
  # столько секунд — бот предупредит о возможном рассинхроне.
  sync_tolerance_sec: 10

  # Число потоков ffmpeg. 0 — на усмотрение ffmpeg (по числу ядер).
  # На одноядерном сервере ставь 1: несколько потоков на одном ядре только
  # добавляют переключений контекста, быстрее не станет.
  threads: 1


queue:
  # Сколько задач обрабатывать одновременно. Требование — последовательно,
  # поэтому 1. Код поддерживает больше, но Яндекс не любит параллельные
  # запросы с одного адреса.
  concurrency: 1

  # Максимум задач в очереди ожидания. Сверх этого бот вежливо откажет.
  max_pending: 20

  # Сколько ждать завершения текущей задачи при остановке контейнера, секунды.
  # Должно быть меньше stop_grace_period в docker-compose.yml.
  shutdown_grace_sec: 1800

  # Сколько дней хранить историю завершённых задач в БД.
  history_ttl_days: 14


priority:
  # ---------------------------------------------------------------------------
  #  Насколько бот уступает остальным процессам сервера.
  #
  #  Нужно, если машина делится с сервисами, которым нельзя мешать: VPN,
  #  прокси, чужой бот. Понижение применяется к тяжёлым подпроцессам —
  #  vot-cli, yt-dlp и особенно ffmpeg, который на одном ядре иначе
  #  занимает его целиком и подвешивает всё остальное.
  #
  #  Работает вместе с cpu_shares и oom_score_adj из docker-compose.yml:
  #  здесь приоритет внутри контейнера, там — между контейнерами.
  # ---------------------------------------------------------------------------

  # Насколько уступать процессор: 0 — обычный приоритет, 19 — максимальная
  # уступчивость. 15 означает «работай, когда никому больше не нужно».
  # Задачи от этого не замедляются, пока сервер не занят другими делами.
  nice_level: 15

  # Отдавать дисковые операции другим процессам (ionice класс idle).
  # Особенно заметно при скачивании многогигабайтного видео.
  idle_io: true


disk:
  # ---------------------------------------------------------------------------
  #  Контроль свободного места. Самая важная секция на небольшом VPS.
  #
  #  Во время обработки часового ролика в 1080p на диске ОДНОВРЕМЕННО лежат:
  #  исходное видео (~2.5 ГБ), русская дорожка (~60 МБ) и результат склейки
  #  (ещё ~2.5 ГБ). То есть пиковая потребность — примерно удвоенный размер
  #  исходника, а не его размер.
  #
  #  Ориентир для диска на 15 ГБ, где под систему уже занято ~6 ГБ
  #  (то есть свободно ~9 ГБ) — значения ниже подобраны ровно под этот случай.
  # ---------------------------------------------------------------------------

  # Ниже этого порога новые задачи не принимаются вообще, гигабайты.
  # Бот вежливо откажет и подскажет, что сделать.
  min_free_gb: 3.0

  # Неприкосновенный запас, гигабайты. При оценке «хватит ли места»
  # эта часть считается недоступной. Нужен, чтобы под ноль не ушли
  # система, логи и SQLite (при заполненном диске база ломается).
  reserve_gb: 1.5

  # Аварийный порог, гигабайты. Если во время задачи свободное место упало
  # ниже — задача немедленно прерывается тем же механизмом, что и /cancel:
  # дочерние процессы убиваются, временные файлы вычищаются.
  # Должен быть НЕ БОЛЬШЕ reserve_gb.
  abort_free_gb: 0.7

  # Во сколько раз пиковая потребность в месте больше итогового файла.
  # 2.5 = исходник + результат + запас на склейку. Уменьшать не советую.
  estimate_multiplier: 2.5

  # Проверять место и оценивать потребность до начала задачи.
  check_before_job: true

  # Фоновый монитор места во время задачи.
  monitor_enabled: true
  monitor_interval_sec: 20

  # Передавать yt-dlp ограничение --max-filesize, вычисленное из свободного
  # места. Так yt-dlp откажется качать заведомо неподъёмный файл сам,
  # не начиная загрузку.
  limit_download_size: true


cache:
  # Кэш готовых результатов по ID видео. Повторная ссылка на тот же ролик
  # отдаётся мгновенно и не тратит ни трафик, ни квоту Яндекса.
  enabled: true

  # Сколько часов считать запись в кэше актуальной. 48 = 2 суток.
  ttl_hours: 48

  # Потолок размера каталога кэша, гигабайты. При превышении удаляются
  # самые давно не используемые записи. 0 — без ограничения.
  # На диске в 15 ГБ больше 3 ГБ под кэш отдавать опасно.
  max_size_gb: 3

  # Как часто запускать уборку кэша, минуты.
  cleanup_interval_min: 30

  # Помнить telegram file_id даже после удаления файла с диска.
  # file_id живёт на серверах Telegram практически вечно, поэтому повторная
  # отправка возможна вообще без файла. Настоятельно рекомендуется true.
  keep_file_ids: true

  # ГЛАВНЫЙ ПАРАМЕТР ДЛЯ МАЛЕНЬКОГО ДИСКА.
  # false — сразу после подтверждённой отправки в Telegram файл на диске
  #         не сохраняется вообще: в кэш пишется только file_id.
  #         Повторная выдача того же ролика всё равно мгновенная — она идёт
  #         по file_id с серверов Telegram, минуя диск полностью.
  #         Место освобождается в ту же секунду, как файл ушёл.
  # true  — держать файл на диске до истечения ttl_hours. Имеет смысл, только
  #         если ты собираешься забирать результаты не через Telegram
  #         (например, копировать их с сервера напрямую).
  keep_files_after_send: false


links:
  # Раздача больших файлов прямой ссылкой через nginx, когда файл
  # не влезает в telegram.max_upload_bytes.
  enabled: true

  # Публичный адрес, по которому снаружи доступен nginx.
  # ОБЯЗАТЕЛЬНО замени на свой — бот не стартует, пока здесь заглушка.
  #
  # Формат: http://<адрес сервера>[:<порт>]
  #   • порт указывать нужно, если HTTP_PORT в .env не равен 80;
  #   • порт должен совпадать с HTTP_PORT и быть открыт в файрволе;
  #   • вместо IP можно указать домен, а с настроенным TLS — https://.
  public_base_url: "ЗАМЕНИ_НА_СВОЙ_АДРЕС"

  # Одноразовая ссылка: после первого скачивания токен становится
  # недействительным. Реализовано через nginx auth_request к боту.
  # false — ссылку можно использовать многократно, пока не истечёт TTL.
  one_time: true

  # Окно после первого обращения, в течение которого одноразовая ссылка
  # продолжает работать, минуты.
  # Зачем: браузеры и менеджеры загрузок качают большой файл несколькими
  # запросами (Range-запросы), и каждый из них — отдельная проверка токена.
  # Без этого окна скачивание оборвалось бы на втором запросе.
  # Смысл «одноразовости» сохраняется: ссылка живёт один сеанс скачивания,
  # а не бессрочно. Ставь примерно во столько, за сколько успевает скачаться
  # самый большой файл. Игнорируется при one_time: false.
  one_time_grace_min: 60

  # Сколько часов жить файлу и токену. По истечении файл удаляется.
  # На небольшом диске держать выложенные гигабайты сутками нельзя.
  ttl_hours: 12

  # Удалять файл сразу, как закончился сеанс скачивания (истекло окно
  # one_time_grace_min после первого обращения), не дожидаясь ttl_hours.
  # На маленьком диске это освобождает место через час после скачивания
  # вместо двенадцати. Работает только при one_time: true.
  delete_after_download: true

  # Внутренний HTTP-сервер бота: проверка токенов для nginx и /healthz.
  # Наружу не публикуется, только внутрь docker-сети.
  http_host: "0.0.0.0"
  http_port: 8080

  # Как часто удалять протухшие файлы и токены, минуты.
  cleanup_interval_min: 15


logging:
  # DEBUG | INFO | WARNING | ERROR
  # DEBUG печатает полные командные строки vot-cli/yt-dlp/ffmpeg — удобно
  # при разборе проблем, но токен Яндекса в логе будет замаскирован.
  level: "INFO"

  # Файл лога. Ротация по размеру.
  file: "/data/logs/bot.log"

  # Размер одного файла лога в байтах перед ротацией. 52428800 = 50 МБ.
  max_bytes: 52428800

  # Сколько старых файлов хранить.
  backup_count: 5

  # true — писать в файл структурированный JSON (удобно грепать и парсить).
  # false — человекочитаемые строки.
  json: true

  # Дублировать лог в stdout контейнера (docker compose logs).
  console: true
