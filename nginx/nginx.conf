# =============================================================================
#  nginx для video_tg
#
#  Одна задача: отдавать файлы, которые не влезли в лимит Telegram, по прямой
#  ссылке вида /dl/<token>/<имя файла> — и только после проверки токена.
#
#  Проверку делает сам бот: nginx через auth_request спрашивает у него
#  http://bot:8080/_auth, передавая исходный URI. Бот смотрит токен в SQLite,
#  проверяет срок жизни и отмечает использование. Одноразовость средствами
#  одного nginx не реализуется — отсюда и этот запрос.
#
#  Content-Disposition намеренно не выставляется: имя файла берётся браузером
#  из последнего сегмента URL, который приходит percent-encoded в UTF-8, и
#  русские названия скачиваются корректно. Заголовок с кириллицей их бы сломал.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_user_agent" '
                      'auth=$upstream_status rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # --- Отдача больших файлов -----------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    aio                 threads;
    directio            16m;
    output_buffers      2 1m;
    keepalive_timeout   65;

    # Клиент может качать долго и медленно — не рвём соединение.
    send_timeout        3600s;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Загрузок к нам нет, поэтому тело запроса ограничиваем жёстко.
    client_max_body_size 1m;

    server_tokens       off;
    reset_timedout_connection on;

    gzip                off;   # видео уже сжато, gzip только тратит CPU

    # --- Бот (проверка токенов) -----------------------------------------------
    upstream video_tg_bot {
        server bot:8080;
        keepalive 4;
    }

    # -------------------------------------------------------------------------
    #  HTTP
    # -------------------------------------------------------------------------
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # Для HTTPS: раскомментируй редирект ниже и блок server снизу.
        # location / { return 301 https://$host$request_uri; }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # --- Служебное --------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Внутренний эндпоинт проверки токена. Снаружи недоступен (internal).
        location = /_auth {
            internal;

            proxy_pass              http://video_tg_bot/_auth;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        X-Real-IP $remote_addr;

            proxy_connect_timeout   5s;
            proxy_read_timeout      10s;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
        }

        # --- Собственно раздача ------------------------------------------------
        # /dl/<token>/<имя файла>
        location ~ "^/dl/(?<dl_token>[A-Za-z0-9_-]{16,64})/(?<dl_name>[^/]+)$" {
            auth_request /_auth;

            # Понятные страницы вместо голых кодов ошибок.
            error_page 401 403 = @denied;
            error_page 404     = @gone;

            alias /srv/files/$dl_token/$dl_name;

            # Докачка и перемотка.
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

            limit_rate_after 32m;   # первые 32 МБ без ограничения скорости
            # limit_rate 20m;       # раскомментируй, чтобы ограничить отдачу
        }

        location @denied {
            default_type text/plain; charset utf-8;
            return 403 "Ссылка недействительна: она уже использована или истекла.\nПопроси бота прислать файл заново.\n";
        }

        location @gone {
            default_type text/plain; charset utf-8;
            return 404 "Файл уже удалён по истечении срока хранения.\nПопроси бота прислать его заново.\n";
        }

        # Всё остальное наружу не показываем.
        location / {
            default_type text/plain; charset utf-8;
            return 404 "Not found\n";
        }
    }

    # -------------------------------------------------------------------------
    #  HTTPS — раскомментируй целиком, когда получишь сертификат
    #
    #  Быстрый способ получить сертификат (на хосте, не в контейнере):
    #      sudo apt install -y certbot
    #      docker compose stop nginx
    #      sudo certbot certonly --standalone -d video.example.com
    #      sudo cp -rL /etc/letsencrypt/live/video.example.com ./nginx/certs
    #      docker compose start nginx
    #
    #  После этого не забудь поменять links.public_base_url в config.yaml
    #  на https://video.example.com
    # -------------------------------------------------------------------------
    # server {
    #     listen      443 ssl;
    #     listen      [::]:443 ssl;
    #     http2       on;
    #     server_name video.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    #
    #     location = /nginx-health {
    #         access_log off;
    #         return 200 "ok\n";
    #     }
    #
    #     location = /_auth {
    #         internal;
    #         proxy_pass              http://video_tg_bot/_auth;
    #         proxy_pass_request_body off;
    #         proxy_set_header        Content-Length "";
    #         proxy_set_header        X-Original-URI $request_uri;
    #         proxy_connect_timeout   5s;
    #         proxy_read_timeout      10s;
    #         proxy_http_version      1.1;
    #         proxy_set_header        Connection "";
    #     }
    #
    #     location ~ "^/dl/(?<dl_token>[A-Za-z0-9_-]{16,64})/(?<dl_name>[^/]+)$" {
    #         auth_request /_auth;
    #         error_page 401 403 = @denied;
    #         error_page 404     = @gone;
    #         alias /srv/files/$dl_token/$dl_name;
    #         add_header Accept-Ranges bytes always;
    #         add_header Cache-Control "private, no-store" always;
    #         limit_rate_after 32m;
    #     }
    #
    #     location @denied {
    #         default_type text/plain; charset utf-8;
    #         return 403 "Ссылка недействительна: она уже использована или истекла.\n";
    #     }
    #
    #     location @gone {
    #         default_type text/plain; charset utf-8;
    #         return 404 "Файл уже удалён по истечении срока хранения.\n";
    #     }
    #
    #     location / {
    #         default_type text/plain; charset utf-8;
    #         return 404 "Not found\n";
    #     }
    # }
}
